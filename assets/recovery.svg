<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-label="Checkpoint and recovery: the writer creates a multipart upload, uploads parts and checkpoints a state. After the writer process dies, finish in another process uploads the trailing bytes and completes the upload.">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f3f4f6; stroke: #4b5563; stroke-width: 1.5; }
    .note { fill: #e5e7eb; stroke: #6b7280; stroke-width: 1.2; }
    .t { fill: #111827; font: 600 14px Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; text-anchor: middle; }
    .m { fill: #111827; font: 13px Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; text-anchor: middle; }
    .l { fill: #111827; font: 13px Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .life { stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 5; }
    .a { fill: none; stroke: #374151; stroke-width: 1.8; }
    .h { fill: #374151; }
    .x { stroke: #111827; stroke-width: 3; stroke-linecap: round; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path class="h" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="900" height="460"/>

  <path class="life" d="M150 52 V448"/>
  <path class="life" d="M450 52 V448"/>
  <path class="life" d="M750 52 V448"/>

  <rect class="box" x="55" y="10" width="190" height="42" rx="8"/>
  <text class="t" x="150" y="36">Writer (process A)</text>
  <rect class="box" x="395" y="10" width="110" height="42" rx="8"/>
  <text class="t" x="450" y="36">S3</text>
  <rect class="box" x="655" y="10" width="190" height="42" rx="8"/>
  <text class="t" x="750" y="36">finish (process B)</text>

  <path class="a" d="M150 100 H448" marker-end="url(#ah)"/>
  <text class="m" x="300" y="92">CreateMultipartUpload</text>

  <path class="a" d="M150 142 H448" marker-end="url(#ah)"/>
  <text class="m" x="300" y="134">UploadPart 1..n (background, bounded)</text>

  <rect class="note" x="60" y="166" width="480" height="34" rx="6"/>
  <text class="m" x="300" y="188">checkpoint(): close row group, wait for parts in flight, build footer</text>

  <rect class="note" x="60" y="212" width="480" height="34" rx="6"/>
  <text class="m" x="300" y="234">state = upload id + parts + trailing bytes (unsent bytes + footer)</text>

  <path class="x" d="M138 272 L162 296 M162 272 L138 296"/>
  <text class="l" x="176" y="289">process dies</text>

  <path class="a" d="M750 338 H452" marker-end="url(#ah)"/>
  <text class="m" x="600" y="330">UploadPart n+1.. (trailing bytes)</text>

  <path class="a" d="M750 378 H452" marker-end="url(#ah)"/>
  <text class="m" x="600" y="370">CompleteMultipartUpload(parts 1..n+1)</text>

  <rect class="note" x="380" y="402" width="440" height="34" rx="6"/>
  <text class="m" x="600" y="424">on failure, HEAD the object: the expected size means success</text>
</svg>
