[workspace]
resolver = "2"
members = ["crates/arroyo-core", "crates/arroyo-py"]

[workspace.package]
version = "0.1.2" # x-release-please-version
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/4thel00z/arroyo-python"

[workspace.dependencies]
arroyo-core = { path = "crates/arroyo-core", version = "0.1.2" } # x-release-please-version
arrow-array = "59"
arrow-schema = "59"
parquet = { version = "59", features = ["async"] }
object_store = { version = "0.13", features = ["aws"] }
bytes = "1"
futures = "0.3"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "sync"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
postcard = { version = "1", features = ["use-std"] }
thiserror = "2"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
